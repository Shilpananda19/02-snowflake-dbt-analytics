version: 2

models:

  - name: int_orders_enriched
    description: "Order-level dataset enriched with customer and product attributes."

    columns:
      - name: order_id
        description: "Unique identifier for each order."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer associated with the order."
        data_tests:
          - not_null

      - name: product_id
        description: "Product associated with the order."
        data_tests:
          - not_null

      - name: quantity
        description: "Number of units ordered."
        data_tests:
          - not_null

      - name: unit_price
        description: "Price per unit."
        data_tests:
          - not_null

      - name: order_total
        description: "Total value of the order calculated as quantity multiplied by unit price."
        data_tests:
          - not_null

  - name: int_customer_order_metrics
    description: "Customer-level order metrics derived from enriched order data."

    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        data_tests:
          - not_null
          - unique

      - name: total_orders
        description: "Number of orders placed by the customer."
        data_tests:
          - not_null

      - name: total_quantity
        description: "Total number of units ordered by the customer."
        data_tests:
          - not_null

      - name: total_spend
        description: "Total customer spending across all orders."
        data_tests:
          - not_null

      - name: average_order_value
        description: "Average value of orders placed by the customer."
        data_tests:
          - not_null