version: 2

models:

  - name: customer_order_summary
    description: "Business-ready customer-level order summary for analytics and reporting."

    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        data_tests:
          - not_null
          - unique

      - name: customer_name
        description: "Customer full name."
        data_tests:
          - not_null

      - name: total_orders
        description: "Total number of orders placed by the customer."
        data_tests:
          - not_null

      - name: total_quantity
        description: "Total quantity of products ordered by the customer."
        data_tests:
          - not_null

      - name: total_spend
        description: "Total amount spent by the customer."
        data_tests:
          - not_null

  - name: product_sales_summary
    description: "Business-ready product-level sales summary for analytics and reporting."

    columns:
      - name: product_id
        description: "Unique identifier for each product."
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: "Product name."
        data_tests:
          - not_null

      - name: category
        description: "Product category."
        data_tests:
          - not_null

      - name: total_orders
        description: "Number of distinct orders containing the product."
        data_tests:
          - not_null

      - name: total_quantity
        description: "Total quantity sold."
        data_tests:
          - not_null

      - name: total_sales
        description: "Total sales generated by the product."
        data_tests:
          - not_null