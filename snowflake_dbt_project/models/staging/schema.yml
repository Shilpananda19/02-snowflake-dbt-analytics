version: 2

models:

  - name: stg_customers
    description: "Cleaned customer records from the raw customers source."

    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        data_tests:
          - not_null
          - unique

      - name: customer_name
        description: "Customer full name."
        data_tests:
          - not_null

      - name: email
        description: "Customer email address."
        data_tests:
          - not_null

  - name: stg_orders
    description: "Cleaned order records from the raw orders source."

    columns:
      - name: order_id
        description: "Unique identifier for each order."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer associated with the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: product_id
        description: "Product associated with the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: quantity
        description: "Number of units ordered."
        data_tests:
          - not_null

      - name: unit_price
        description: "Unit price of the product at the time of order."
        data_tests:
          - not_null

  - name: stg_products
    description: "Cleaned product records from the raw products source."

    columns:
      - name: product_id
        description: "Unique identifier for each product."
        data_tests:
          - not_null
          - unique

      - name: product_name
        description: "Product name."
        data_tests:
          - not_null

      - name: category
        description: "Product category."
        data_tests:
          - not_null